spring.application.name=onlinebookstore

# 1. MySQL Server Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/bookstoredb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
